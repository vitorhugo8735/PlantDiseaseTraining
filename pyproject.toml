[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-disease-training"
version = "0.1.0"
description = "Training project for plant disease classification models exported to TorchScript"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
